[package]
name = "solverang"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic numerical solver for nonlinear systems and least-squares problems"
license = "Apache-2.0"
repository = "https://github.com/akiselev/solverang"
readme = "../../README.md"
keywords = ["solver", "nonlinear", "least-squares", "constraints", "cad"]
categories = ["mathematics", "science", "algorithms"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[features]
default = ["std", "macros"]
std = []
parallel = ["rayon"]
sparse = ["faer"]
macros = ["solverang_macros"]
jit = ["dep:anvil"]
nist = []

[dependencies]
nalgebra = "0.34"
levenberg-marquardt = "0.15"
thiserror = "2.0"

# Portable solver-facing numerical contracts. Keep the historical crate import name during
# the federation migration, while the package itself is now owned and published by Solverang.
numeric-contracts = { package = "solverang-contracts", path = "../contracts" }

rayon = { version = "1.10", optional = true }
faer = { version = "0.22", optional = true }
solverang_macros = { version = "0.1.0", path = "../macros", optional = true }

# Transitional compatibility surface for Solverang's historical JIT API. The authoritative
# optimized Anvil compiler remains a separate execution backend; this local adapter keeps
# Solverang portable and its all-features API testable without an absolute filesystem path.
anvil = { package = "sinbad-anvil", path = "../anvil-compat", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "comprehensive"
harness = false

[[bench]]
name = "nist_benchmarks"
harness = false
required-features = ["nist"]

[[bench]]
name = "jit_benchmark"
harness = false
required-features = ["jit", "macros"]
