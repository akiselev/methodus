[package]
name = "solverang"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic numerical solver for nonlinear systems and least-squares problems"
license = "Apache-2.0"
repository = "https://github.com/akiselev/solverang"
readme = "../../README.md"
keywords = ["solver", "nonlinear", "least-squares", "constraints", "cad"]
categories = ["mathematics", "science", "algorithms"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[features]
default = ["std", "macros"]
std = []
parallel = ["rayon"]
sparse = ["faer"]
macros = ["solverang_macros"]
jit = ["dep:anvil"]
nist = []                                                                    # NIST StRD nonlinear regression test problems

[dependencies]
# Linear algebra - version 0.34 is required for levenberg-marquardt compatibility
nalgebra = "0.34"

# Levenberg-Marquardt solver
levenberg-marquardt = "0.15"

# Error handling
thiserror = "2.0"

# DAE/ODE time-integration seam (federation numeric contracts). Mirrors the anvil
# path-dep: solverang consumes the `DaeResidual` / `IntegratorCoeffs` contracts to
# drive its BDF / generalized-alpha integrator (`integrate` module) WITHOUT importing
# the physics-assembly crate (`residua`). Types + traits only; no algorithm crosses
# the seam. Its `nalgebra`/`num-complex` transitive deps compile alongside solverang's
# own (only `f64` slices cross the boundary, so the version skew is harmless).
numeric-contracts = { package = "sinbad-numeric-contracts", path = "/home/dev/sinbad/crates/numeric-contracts" }

# Optional: parallel solving
rayon = { version = "1.10", optional = true }

# Optional: sparse matrices
faer = { version = "0.22", optional = true }

# Optional: automatic Jacobian generation via symbolic differentiation
solverang_macros = { version = "0.1.0", path = "../macros", optional = true }

# Optional: JIT compilation. The JIT (scalar opcode IR + Cranelift codegen) was
# re-homed into the standalone `sinbad-anvil` crate (M1). solverang now depends on
# anvil behind its `jit` feature and reaches the cranelift stack transitively via
# anvil's own (default-on) `jit` feature — no direct cranelift deps here anymore.
anvil = { package = "sinbad-anvil", path = "/home/dev/sinbad/crates/anvil", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "comprehensive"
harness = false

[[bench]]
name = "nist_benchmarks"
harness = false
required-features = ["nist"]

[[bench]]
name = "jit_benchmark"
harness = false
required-features = ["jit", "macros"]
