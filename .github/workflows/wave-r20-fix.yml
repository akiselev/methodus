name: wave-r20-fix

on:
  push:
    branches: [agent/r13-r20-wave-a-f]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Keep committed state immutable on rejection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/scientific/src/lib.rs')
          s = p.read_text()
          old = '''        let mut unchanged = state.clone();
        unchanged.rejected_steps += 1;
        let factor = (0.9 / error.sqrt()).clamp(0.2, 0.8);
        return Ok(StepOutcome::Rejected(RejectedStep {
            unchanged_state: unchanged,'''
          new = '''        let unchanged = state.clone();
        let factor = (0.9 / error.sqrt()).clamp(0.2, 0.8);
        return Ok(StepOutcome::Rejected(RejectedStep {
            unchanged_state: unchanged,'''
          if old not in s:
              raise SystemExit('rejection mutation block not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          git rm .github/workflows/wave-r20-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'Keep committed BDF state immutable on rejection'
          git push origin HEAD:agent/r13-r20-wave-a-f
