name: summarize-r9-diagnostics
on:
  push:
    branches: [agent/r0-r9-resolvent-foundation]
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-resolvent-foundation
      - name: Reduce captured diagnostics
        shell: bash
        run: |
          {
            echo '=== TEST FAILURES ==='
            grep -nE -A12 -B6 'FAILED|panicked|failures:|test result: FAILED|error:' r9-test.txt | tail -180 || true
            echo '=== DOC FAILURES ==='
            grep -nE -A8 -B4 'error:|warning:' r9-doc.txt | tail -120 || true
          } > r9-summary.txt
          rm .github/workflows/summarize-r9-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add r9-summary.txt .github/workflows/summarize-r9-diagnostics.yml
          git commit -m "summarize remaining R9 diagnostics"
          git push origin HEAD:agent/r0-r9-resolvent-foundation
