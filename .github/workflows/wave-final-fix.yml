name: wave-final-fix
on:
  push:
    branches: [agent/r13-r20-wave-a-f]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix rollback and test dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/scientific/src/lib.rs')
          s = p.read_text()
          old = '        let mut unchanged = state.clone(); unchanged.rejected_steps += 1;'
          new = '        let unchanged = state.clone();'
          if old not in s:
              raise SystemExit('rejected-state mutation target not found')
          p.write_text(s.replace(old, new))

          p = Path('crates/scientific/Cargo.toml')
          s = p.read_text()
          if '[dev-dependencies]' not in s:
              s += '\n[dev-dependencies]\nserde_json = "1"\n'
          elif 'serde_json' not in s.split('[dev-dependencies]', 1)[1]:
              s = s.replace('[dev-dependencies]', '[dev-dependencies]\nserde_json = "1"', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          rm -f .github/workflows/wave-r20-fix.yml
          git rm .github/workflows/wave-final-fix.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Preserve bit-identical rejected BDF state and fix CI'
          git push origin HEAD:agent/r13-r20-wave-a-f
