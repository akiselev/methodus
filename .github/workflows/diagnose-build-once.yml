name: diagnose-build-once
on:
  push:
    branches: [agent/r0-r9-resolvent-foundation]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-resolvent-foundation
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Capture all-features build
        shell: bash
        run: |
          set +e
          cargo build --workspace --all-features > ci-build.txt 2>&1
          status=$?
          echo "exit_status=$status" >> ci-build.txt
          rm .github/workflows/diagnose-build-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-build.txt .github/workflows/diagnose-build-once.yml
          git commit -m "capture R9 build diagnostics"
          git push origin HEAD:agent/r0-r9-resolvent-foundation
