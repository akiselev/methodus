name: r19-trace-acceptance
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python tools/r19_trace_acceptance.py
      - run: cargo fmt --all
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/scientific
          git commit -m 'Add R19 per-block iteration histories'
          git push origin HEAD:agent/r13-r20-wave-a-f
