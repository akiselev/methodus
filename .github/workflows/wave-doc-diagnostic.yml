name: wave-doc-diagnostic

on:
  push:
    branches: [agent/r13-r20-wave-a-f]

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture rustdoc output
        shell: bash
        run: |
          set +e
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps > rustdoc-diagnostic.log 2>&1
          echo "$?" > rustdoc-diagnostic.exit
          set -e
          git rm .github/workflows/wave-doc-diagnostic.yml
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rustdoc-diagnostic.log rustdoc-diagnostic.exit
          git commit -m 'Capture rustdoc failure diagnostic'
          git push origin HEAD:agent/r13-r20-wave-a-f
