name: fix-contracts-clippy
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply iterator rewrites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('crates/contracts/src/lib.rs')
          s=p.read_text()
          s,n1=re.subn(
              r'for m in 0\.\.major \{\s*offsets\[m\] = cursor as u32;',
              'for (m, offset) in offsets.iter_mut().enumerate().take(major) {\n            *offset = cursor as u32;',
              s,
              count=1,
          )
          s,n2=re.subn(
              r'for r in 0\.\.self\.nrows\(\) \{\s*for k in\s*self\.pattern\.offsets\[r\]\.to_usize\(\)\.\.self\.pattern\.offsets\[r \+ 1\]\.to_usize\(\)\s*\{\s*out\[r\] \+= self\.values\[k\] \* x\[self\.pattern\.indices\[k\]\.to_usize\(\)\]\s*\}\s*\}',
              'for (r, out_r) in out.iter_mut().enumerate().take(self.nrows()) {\n                    for k in self.pattern.offsets[r].to_usize()..self.pattern.offsets[r + 1].to_usize() {\n                        *out_r += self.values[k] * x[self.pattern.indices[k].to_usize()]\n                    }\n                }',
              s,
              count=1,
          )
          s,n3=re.subn(
              r'for c in 0\.\.self\.ncols\(\) \{\s*for k in\s*self\.pattern\.offsets\[c\]\.to_usize\(\)\.\.self\.pattern\.offsets\[c \+ 1\]\.to_usize\(\)\s*\{\s*out\[self\.pattern\.indices\[k\]\.to_usize\(\)\] \+= self\.values\[k\] \* x\[c\]\s*\}\s*\}',
              'for (c, x_c) in x.iter().copied().enumerate().take(self.ncols()) {\n                    for k in self.pattern.offsets[c].to_usize()..self.pattern.offsets[c + 1].to_usize() {\n                        out[self.pattern.indices[k].to_usize()] += self.values[k] * x_c\n                    }\n                }',
              s,
              count=1,
          )
          if (n1,n2,n3)!=(1,1,1):
              raise SystemExit(f'expected one rewrite each, got {(n1,n2,n3)}')
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/contracts/src/lib.rs
          git commit -m 'Satisfy current stable clippy in numeric contracts'
          git push origin HEAD:agent/r13-r20-wave-a-f
