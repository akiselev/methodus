name: final-scientific-clippy
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('crates/scientific/src/preconditioners.rs')
          s=p.read_text()
          s=s.replace('''    pub fn len(&self) -> usize {
        self.inverse_diagonal.len()
    }
''','''    pub fn len(&self) -> usize {
        self.inverse_diagonal.len()
    }

    pub fn is_empty(&self) -> bool {
        self.inverse_diagonal.is_empty()
    }
''',1)
          old='''                for i in 0..row.len {
                    let correction = (0..col.len)
                        .map(|j| block.values[i * col.len + j] * out[col.offset + j])
                        .sum::<f64>();
                    local[i] -= correction;
                }'''
          new='''                for (i, local_i) in local.iter_mut().enumerate().take(row.len) {
                    let correction = (0..col.len)
                        .map(|j| block.values[i * col.len + j] * out[col.offset + j])
                        .sum::<f64>();
                    *local_i -= correction;
                }'''
          if old not in s: raise SystemExit('triangular loop target not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git rm .github/workflows/final-scientific-clippy.yml
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix final scientific preconditioner clippy findings'
          git push origin HEAD:agent/r13-r20-wave-a-f
