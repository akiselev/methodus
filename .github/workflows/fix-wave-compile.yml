name: fix-wave-compile
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compile fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('crates/scientific/src/lib.rs')
          s=p.read_text()
          s=s.replace(
              '#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct CoupledSolveConfig',
              '#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub struct CoupledSolveConfig',
              1,
          )
          s=s.replace(
              '        let base = if jacobi { &original } else { &working };',
              '        let base = if jacobi { original.clone() } else { working.clone() };',
              1,
          )
          s=s.replace('        problem.residual(ctx, base, &mut residual)?;', '        problem.residual(ctx, &base, &mut residual)?;', 1)
          s=s.replace('            problem.jvp(ctx, base, &direction, &mut column)?;', '            problem.jvp(ctx, &base, &direction, &mut column)?;', 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit code
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/scientific
          git commit -m 'Fix Wave block solver compile defects'
          git push origin HEAD:agent/r13-r20-wave-a-f
